name: Mobile gameplay smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mobile-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run mobile career and match smoke
        run: python tests/smoke.py
      - name: Run story decision and persistence regression
        run: python tests/test_story_v07.py
