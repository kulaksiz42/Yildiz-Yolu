name: Yildiz Yolu source checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check src/logic.js
      - name: Check anatomical mesh and joint transforms
        run: node tests/rig-audit.js
      - name: Validate GLB and renderer bridge
        run: |
          node --check assets/rig/bridge.js
          python tests/test_rig_assets.py
      - name: Build standalone HTML
        run: python3 build.py
      - name: Ensure generated HTML is committed
        run: git diff --exit-code -- index.html
      - name: Check local 3D rig runtime and offline assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1
          assert html.count('</script>') == 3  # classic game, legacy bridge, Three importmap
          assert '<script src="./assets/rig/bridge.js"></script>' in html
          assert 'rigs/game-rigs.mjs' in html and 'rigs/vendor/three.module.js' in html
          assert 'https://cdn.' not in html and 'unpkg.com' not in html
          assert 'function advanceFlight(dt)' in html
          assert 'persistInputs();draft[k]' in html
          print('Basic standalone build checks passed.')
          PY
